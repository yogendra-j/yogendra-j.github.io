featured_repositories:
  - name: claude-code-opencode
    url: https://github.com/yogendra-j/claude-code-opencode
    language: JavaScript
    summary: A command-line bridge to OpenCode. Create a session, send a follow-up prompt, stream events, and read the final result.
    highlights:
      - Session creation and follow-up prompts through the OpenCode API
      - Streams text, tool calls, and child-session events over SSE
      - Prints a JSON result for use by another tool

  - name: pdf-generator
    url: https://github.com/yogendra-j/pdf-generator
    live_url: https://pdf-generator-lemon.vercel.app
    language: TypeScript
    updated_at: 2026-01-16
    summary: A TypeScript PDF generation app with a live demo.
    highlights:
      - Full-stack TypeScript implementation
      - Real deployed product surface
      - API and document generation workflows

  - name: small-experiments
    url: https://github.com/yogendra-j/small-experiments
    language: Go
    updated_at: 2023-09-16
    summary: Algorithm and command-line experiments implemented in Go.
    highlights:
      - Practical Go experiments
      - Algorithms and tooling exploration
      - Includes the code behind my geohashing post

  - name: node-typescipt-starter
    url: https://github.com/yogendra-j/node-typescipt-starter
    language: TypeScript
    updated_at: 2024-04-28
    summary: Starter template for a modern TypeScript Node.js codebase.
    highlights:
      - Tooling and project setup focus
      - pnpm, ts-node, ESLint, and Prettier setup
      - Code behind my TypeScript Node.js setup post


